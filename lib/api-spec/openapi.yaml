openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: E-Commerce Inventory & Sales System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product management
  - name: customers
    description: Customer management
  - name: orders
    description: Order management
  - name: inventory
    description: Inventory management
  - name: analytics
    description: Sales analytics and dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Products ────────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: lowStock
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products/categories:
    get:
      operationId: listCategories
      tags: [products]
      summary: List all unique product categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  # ─── Customers ───────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerBody"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{customerId}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer by ID
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
    put:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerBody"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Orders ──────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: customerId
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderWithDetails"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order (auto-reduces stock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithDetails"

  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order with line items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithDetails"
        "404":
          description: Not found
    put:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithDetails"

  # ─── Inventory Logs ──────────────────────────────────────────────────────────
  /inventory/logs:
    get:
      operationId: listInventoryLogs
      tags: [inventory]
      summary: List inventory change logs
      parameters:
        - in: query
          name: productId
          schema:
            type: integer
      responses:
        "200":
          description: List of inventory logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryLog"

  /inventory/update:
    post:
      operationId: updateInventory
      tags: [inventory]
      summary: Manually update product stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryBody"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  # ─── Analytics ───────────────────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getDashboardStats
      tags: [analytics]
      summary: Get admin dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /analytics/top-products:
    get:
      operationId: getTopProducts
      tags: [analytics]
      summary: Top selling products by revenue
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopProduct"

  /analytics/sales-by-category:
    get:
      operationId: getSalesByCategory
      tags: [analytics]
      summary: Total sales grouped by product category
      responses:
        "200":
          description: Sales by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategorySales"

  /analytics/sales-trend:
    get:
      operationId: getSalesTrend
      tags: [analytics]
      summary: Daily sales totals for trend chart
      parameters:
        - in: query
          name: days
          schema:
            type: integer
      responses:
        "200":
          description: Sales trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesTrendPoint"

  /analytics/top-customers:
    get:
      operationId: getTopCustomers
      tags: [analytics]
      summary: Customers with highest total purchases
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Top customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopCustomer"

  /analytics/inventory-status:
    get:
      operationId: getInventoryStatus
      tags: [analytics]
      summary: Inventory levels by category
      responses:
        "200":
          description: Inventory status breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Product:
      type: object
      properties:
        productId:
          type: integer
        productName:
          type: string
        category:
          type: string
        price:
          type: number
        stockQuantity:
          type: integer
        description:
          type: string
        isLowStock:
          type: boolean
      required: [productId, productName, category, price, stockQuantity, description, isLowStock]

    CreateProductBody:
      type: object
      properties:
        productName:
          type: string
        category:
          type: string
        price:
          type: number
        stockQuantity:
          type: integer
        description:
          type: string
      required: [productName, category, price, stockQuantity, description]

    Customer:
      type: object
      properties:
        customerId:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
      required: [customerId, name, email, phone, address]

    CreateCustomerBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
      required: [name, email, phone, address]

    OrderItem:
      type: object
      properties:
        orderDetailId:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
        subtotal:
          type: number
        price:
          type: number
      required: [orderDetailId, productId, productName, quantity, subtotal, price]

    OrderWithDetails:
      type: object
      properties:
        orderId:
          type: integer
        customerId:
          type: integer
        customerName:
          type: string
        orderDate:
          type: string
        totalAmount:
          type: number
        status:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required: [orderId, customerId, customerName, orderDate, totalAmount, status, items]

    CreateOrderBody:
      type: object
      properties:
        customerId:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineInput"
      required: [customerId, items]

    OrderLineInput:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: integer
      required: [productId, quantity]

    UpdateOrderStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
      required: [status]

    InventoryLog:
      type: object
      properties:
        logId:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        stockBefore:
          type: integer
        stockAfter:
          type: integer
        updatedAt:
          type: string
      required: [logId, productId, productName, stockBefore, stockAfter, updatedAt]

    UpdateInventoryBody:
      type: object
      properties:
        productId:
          type: integer
        newStock:
          type: integer
      required: [productId, newStock]

    DashboardStats:
      type: object
      properties:
        totalProducts:
          type: integer
        totalOrders:
          type: integer
        totalRevenue:
          type: number
        totalCustomers:
          type: integer
        lowStockCount:
          type: integer
        pendingOrders:
          type: integer
      required: [totalProducts, totalOrders, totalRevenue, totalCustomers, lowStockCount, pendingOrders]

    TopProduct:
      type: object
      properties:
        productId:
          type: integer
        productName:
          type: string
        category:
          type: string
        totalSold:
          type: integer
        totalRevenue:
          type: number
      required: [productId, productName, category, totalSold, totalRevenue]

    CategorySales:
      type: object
      properties:
        category:
          type: string
        totalOrders:
          type: integer
        totalRevenue:
          type: number
      required: [category, totalOrders, totalRevenue]

    SalesTrendPoint:
      type: object
      properties:
        date:
          type: string
        totalRevenue:
          type: number
        totalOrders:
          type: integer
      required: [date, totalRevenue, totalOrders]

    TopCustomer:
      type: object
      properties:
        customerId:
          type: integer
        name:
          type: string
        email:
          type: string
        totalOrders:
          type: integer
        totalSpent:
          type: number
      required: [customerId, name, email, totalOrders, totalSpent]

    InventoryStatus:
      type: object
      properties:
        category:
          type: string
        totalStock:
          type: integer
        productCount:
          type: integer
        lowStockCount:
          type: integer
      required: [category, totalStock, productCount, lowStockCount]
